# Free portfolio/demo deployment: data is in memory and resets whenever the service restarts.
spring.datasource.url=jdbc:h2:mem:clubconnect;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.thymeleaf.cache=true
spring.h2.console.enabled=false
clubconnect.seed-data.enabled=true
clubconnect.bootstrap-admin.enabled=false
clubconnect.mail.enabled=false
