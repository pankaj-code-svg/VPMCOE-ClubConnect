# Production overrides. Supply database and bootstrap-admin values as private host variables.
spring.jpa.show-sql=false
spring.thymeleaf.cache=true
clubconnect.seed-data.enabled=false
clubconnect.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
clubconnect.bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:}
clubconnect.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
clubconnect.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
