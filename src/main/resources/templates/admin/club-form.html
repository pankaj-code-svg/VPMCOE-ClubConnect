<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::#content})}">
<head>
    <title>Club Form - VPMCOE ClubConnect</title>
</head>
<body>
    <div id="content">
        <div class="container py-4">
            <div class="row justify-content-center">
                <div class="col-lg-8">

                    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                        <div class="mb-4">
                            <a th:href="@{/admin/clubs}" class="text-decoration-none small text-muted">
                                <i class="bi bi-arrow-left me-1"></i> Back to Clubs List
                            </a>
                            <h3 class="fw-bold text-dark mt-2 mb-1" th:text="${club.id != null ? 'Edit Club: ' + club.name : 'Create New College Club'}">Club Form</h3>
                            <div class="text-muted small">Register or modify club parameters for VPMCOE</div>
                        </div>

                        <form th:action="${club.id != null} ? @{/admin/clubs/{id}/edit(id=${club.id})} : @{/admin/clubs/new}"
                              th:object="${club}" method="post">

                            <div class="row g-3 mb-3">
                                <div class="col-md-7">
                                    <label for="name" class="form-label small fw-semibold text-dark">Club Name *</label>
                                    <input type="text" class="form-control rounded-3" id="name" th:field="*{name}" placeholder="e.g. Technology Club" required>
                                    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger small mt-1"></div>
                                </div>
                                <div class="col-md-5">
                                    <label for="category" class="form-label small fw-semibold text-dark">Category *</label>
                                    <select class="form-select rounded-3" id="category" th:field="*{category}" required>
                                        <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat.displayName}">TECHNICAL</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="shortTagline" class="form-label small fw-semibold text-dark">Tagline / Motto *</label>
                                <input type="text" class="form-control rounded-3" id="shortTagline" th:field="*{shortTagline}" placeholder="A punchy 1-line mission" required>
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label small fw-semibold text-dark">Detailed Description & Objectives *</label>
                                <textarea class="form-control rounded-3" id="description" th:field="*{description}" rows="4" placeholder="Overview of club activities, goals, and legacy..." required></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="leadUserId" class="form-label small fw-semibold text-dark">Assign Student / Faculty Lead</label>
                                <select class="form-select rounded-3" id="leadUserId" name="leadUserId">
                                    <option value="">-- No Lead Assigned (Vacant) --</option>
                                    <option th:each="u : ${users}"
                                            th:value="${u.id}"
                                            th:selected="${club.lead != null and club.lead.id == u.id}"
                                            th:text="${u.fullName} + ' (' + ${u.email} + ' - ' + ${u.department} + ')'">
                                    </option>
                                </select>
                                <div class="form-text small">Assigning a user will grant them the Club Lead portal permissions.</div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="facultyAdvisor" class="form-label small fw-semibold text-dark">Faculty Coordinator</label>
                                    <input type="text" class="form-control rounded-3" id="facultyAdvisor" th:field="*{facultyAdvisor}" placeholder="e.g. Prof. S. R. Jagtap">
                                </div>
                                <div class="col-md-6">
                                    <label for="contactEmail" class="form-label small fw-semibold text-dark">Club Email</label>
                                    <input type="email" class="form-control rounded-3" id="contactEmail" th:field="*{contactEmail}" placeholder="club@vpmcoe.ac.in">
                                </div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="roomVenue" class="form-label small fw-semibold text-dark">Campus Room / Venue</label>
                                    <input type="text" class="form-control rounded-3" id="roomVenue" th:field="*{roomVenue}" placeholder="e.g. Lab 304, IT Building">
                                </div>
                                <div class="col-md-6">
                                    <label for="meetingSchedule" class="form-label small fw-semibold text-dark">Meeting Schedule</label>
                                    <input type="text" class="form-control rounded-3" id="meetingSchedule" th:field="*{meetingSchedule}" placeholder="e.g. Every Wednesday at 4:30 PM">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="bannerGradient" class="form-label small fw-semibold text-dark">Card Gradient CSS</label>
                                <input type="text" class="form-control rounded-3" id="bannerGradient" th:field="*{bannerGradient}" placeholder="linear-gradient(135deg, #1e3c72 0%, #2a5298 100%)">
                            </div>

                            <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                                <a th:href="@{/admin/clubs}" class="btn btn-light rounded-3">Cancel</a>
                                <button type="submit" class="btn btn-primary fw-bold rounded-3 px-4">
                                    <i class="bi bi-check-circle me-1"></i>
                                    <span th:text="${club.id != null ? 'Save Changes' : 'Create Club'}">Save</span>
                                </button>
                            </div>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>
</body>
</html>
